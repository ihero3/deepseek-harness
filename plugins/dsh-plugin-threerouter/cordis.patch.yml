# Threerouter integration bundle patch: inserts the Threerouter brand shadow-override,
# account authentication overlay, and model routing plugin into the Cordis Loader, and
# disables the upstream occupant of the slots that override fills.

# `sidebar.brand.mark` and `sidebar.brand.name` are `single`-kind slots, so the last
# registration wins. A release build compiles out ui-brand-official's
# `DSH_CLIENT_BUILD_PROFILE !== 'official'` gate, and the client-module guard overwrites
# the priority of every non-chain registration, so this plugin cannot win by ordering or
# priority. Disabling the upstream row is order-independent: the loader drops it before
# the client roster is composed.
- id: ui-brand-official
  disabled: true

# `settings.launcher` is a `single`-kind slot as well, and while the upstream account row
# occupies it the sidebar foot shows its account menu in place of the Settings trigger.
# This deployment signs in to Threerouter rather than to the account service, so the row is
# disabled and the Threerouter chip takes that seat, along with the `openSettings` face the
# seat carries.
- id: ui-settings-account
  disabled: true

- insert:
    - id: threerouter-integration
      name: dsh-plugin-threerouter
